sonar.projectKey=shopmonkeyus_go-common
sonar.organization=shopmonkeyus
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.

sonar.test.inclusions=**/*_test.go

# Test files are also listed here so they stay out of lines of code under
# SonarCloud's new analysis scope, which ignores sonar.tests and
# sonar.test.inclusions. The module has no generated code today.
sonar.exclusions=\
  **/*_test.go,\
  **/testdata/**,\
  **/fixtures/**,\
  **/mocks/**,\
  **/golden/**,\
  **/*.pb.go,\
  **/vendor/**

sonar.test.exclusions=\
  **/testdata/**,\
  **/fixtures/**,\
  **/mocks/**,\
  **/golden/**

# Written by the Test step in .github/workflows/go.yml.
sonar.go.coverage.reportPaths=coverage.out
